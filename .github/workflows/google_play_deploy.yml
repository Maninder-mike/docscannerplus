name: Play Store Build, Sign & Release

on:
  push:
    branches: [ beta ]
    tags: [ 'v*' ]
    paths:
      - "pubspec.yaml"
      - "lib/**"
      - "android/**"
      - "fastlane/**"
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-release:
    name: Build, Sign & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # Required for GitHub releases

    env:
      KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog

      # Extract version from pubspec.yaml
      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/\+.*//')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "version_number=$VERSION" >> $GITHUB_OUTPUT
          
          # Auto-increment version code with offset
          VERSION_CODE=$(( $GITHUB_RUN_NUMBER + 10 ))
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          
          echo "📦 Building version: v$VERSION+$VERSION_CODE"

      # Check if release already exists
      - name: Check if release exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version ${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version ${{ steps.version.outputs.version }} is new"
          fi

      - name: Stop if version already released
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "::warning::Version ${{ steps.version.outputs.version }} already released. Skipping build."
          exit 0

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Setup Flutter with caching
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
          cache: true

      # Cache dependencies
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-v2-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-v2-

      # Decode keystore
      - name: Prepare Android signing
        run: |
          echo "🔐 Preparing Android keystore..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      # Create key.properties
      - name: Create key.properties
        run: |
          echo "📝 Creating key.properties..."
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # Install dependencies
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          flutter pub get

      # Analyze code
      - name: Analyze code
        run: |
          echo "🔍 Analyzing code..."
          flutter analyze

      # Run tests
      - name: Run tests
        continue-on-error: true
        run: |
          echo "🧪 Running tests..."
          flutter test || echo "::warning::Some tests failed"

      # Build APK and App Bundle
      - name: Build Release Artifacts
        run: |
          echo "🏗️ Building APK & App Bundle..."
          flutter build apk --release \
            --build-number=${{ steps.version.outputs.version_code }} \
            --dart-define=ONEDRIVE_CLIENT_ID=$ONEDRIVE_CLIENT_ID
          
          flutter build appbundle --release \
            --build-number=${{ steps.version.outputs.version_code }} \
            --dart-define=ONEDRIVE_CLIENT_ID=$ONEDRIVE_CLIENT_ID
          
          echo "✅ Build complete!"

      # Verify APK Signature
      - name: Verify APK Signature
        run: |
          echo "🔐 Verifying APK signature..."
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f | head -1)
          
          if [ -n "$APKSIGNER" ]; then
            $APKSIGNER verify --verbose "$APK_PATH" && echo "✅ APK signature verified"
          else
            echo "::warning::apksigner not found, skipping verification"
          fi

      # Bundle Size Check
      - name: Bundle Size Check
        id: size_check
        run: |
          echo "📊 Checking bundle size..."
          
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          AAB_SIZE=$(stat -c%s "$AAB_PATH" 2>/dev/null || stat -f%z "$AAB_PATH")
          
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE / 1048576" | bc)
          AAB_SIZE_MB=$(echo "scale=2; $AAB_SIZE / 1048576" | bc)
          
          echo "apk_size_mb=$APK_SIZE_MB" >> $GITHUB_OUTPUT
          echo "aab_size_mb=$AAB_SIZE_MB" >> $GITHUB_OUTPUT
          
          echo "✅ APK: ${APK_SIZE_MB}MB | AAB: ${AAB_SIZE_MB}MB"
          
          echo "## 📊 Bundle Size" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| APK | ${APK_SIZE_MB} MB |" >> $GITHUB_STEP_SUMMARY
          echo "| AAB | ${AAB_SIZE_MB} MB |" >> $GITHUB_STEP_SUMMARY

      # Setup Ruby for Fastlane
      - name: Setup Ruby (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      # Decode Play Store key
      - name: Decode Play Store key
        env:
          PLAY_STORE_KEY: ${{ secrets.PLAY_STORE_KEY }}
        run: |
          echo "$PLAY_STORE_KEY" | base64 --decode > android/fastlane/play-store-key.json

      # Deploy to Play Store
      - name: Deploy to Play Store (Internal)
        working-directory: android
        run: |
          echo "🚀 Deploying to Play Store..."
          bundle exec fastlane deploy_internal

      # Prepare APK for GitHub Release
      - name: Prepare APK for release
        id: prepare_apk
        run: |
          mkdir -p release_output
          cp build/app/outputs/flutter-apk/app-release.apk \
             release_output/docscannerplus-${{ steps.version.outputs.version }}.apk
          
          APK_SIZE=$(ls -lh release_output/*.apk | awk '{print $5}')
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

      # Generate changelog
      - name: Generate changelog
        id: changelog
        run: |
          echo "📝 Generating changelog..."
          
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"• %s" -10)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"• %s" --no-merges | head -15)
          fi
          
          cat > RELEASE_NOTES.md << EOF
          # DocScanner+ ${{ steps.version.outputs.version }} 📄
          
          ## What's New
          
          $COMMITS
          
          ## Download
          
          - **APK Size**: ${{ steps.prepare_apk.outputs.apk_size }}
          - **Build**: #${{ github.run_number }}
          
          ## Installation
          
          1. Download the APK below
          2. Enable "Install from Unknown Sources"
          3. Install and enjoy!
          
          ---
          **Full Changelog**: [$PREV_TAG...${{ steps.version.outputs.version }}](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.version.outputs.version }})
          EOF
          
          cat RELEASE_NOTES.md

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: DocScanner+ ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: release_output/docscannerplus-${{ steps.version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build Summary
      - name: Build Summary
        if: always()
        run: |
          echo "## 🎉 Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ steps.version.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size**: ${{ steps.size_check.outputs.apk_size_mb }} MB" >> $GITHUB_STEP_SUMMARY
          echo "- **AAB Size**: ${{ steps.size_check.outputs.aab_size_mb }} MB" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY

